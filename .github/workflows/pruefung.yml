name: Pruefung

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typen pruefen
        run: npm run typecheck

      - name: Einheitentests
        run: npm test

      - name: Geldpfad ueber HTTP
        run: npm run test:pfad
